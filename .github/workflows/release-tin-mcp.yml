name: Release tin-mcp

on:
  push:
    tags:
      - 'tin-mcp-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., tin-mcp-v0.1.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-C target-feature=+crt-static'

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin_suffix: linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            bin_suffix: linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_suffix: darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_suffix: darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation toolchain (musl)
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        run: |
          cd tools/tin-mcp
          cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd tools/tin-mcp
          SRC="target/${{ matrix.target }}/release/tin-mcp"
          PKG_DIR="tin-mcp-${{ matrix.target }}"
          mkdir -p "$PKG_DIR"

          # Binary renamed to short platform name (launch.sh convention)
          cp "$SRC" "$PKG_DIR/tin-mcp-${{ matrix.bin_suffix }}"

          # MCP bundle files
          cp mcpb/launch.sh "$PKG_DIR/"
          cp mcpb/manifest.json "$PKG_DIR/"

          tar czf "${PKG_DIR}.tar.gz" "$PKG_DIR"
          echo "artifact=${PKG_DIR}.tar.gz" >> "$GITHUB_OUTPUT"
        id: package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tin-mcp-${{ matrix.target }}
          path: tools/tin-mcp/${{ steps.package.outputs.artifact }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine tag
        id: tag
        run: |
          TAG="${{ github.ref_name }}"
          if [[ -z "$TAG" ]] || [[ "$TAG" == "refs/heads/"* ]]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: tin-mcp ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: artifacts/**/*.tar.gz
